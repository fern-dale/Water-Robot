<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Robot</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>
<header>
  <h1>Autonomous Water Robot</h1>
  <div class="status">
    <div class="status-dot"></div>
    <span id="status-txt">Live!!!!!</span>
  </div>
</header>

<div class="page">

  <div class="map-wrap">
    <img id="lake-img" src="WTlakeMap.png" alt="Lake Map"
         onerror="this.style.display='none'; document.getElementById('map-fallback').style.display='flex'">
    <div class="map-fallback" id="map-fallback">WTlakeMap.png not found</div>
    <svg id="map-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="sidebar">
    <div id="warn-banner">⚠ Low battery — returning to dock</div>
    <div class="card">
      <div class="card-label">Water Temperature</div>
      <div class="card-value" id="temp-val">--</div>
      <div class="card-unit">°C</div>
    </div>
    <div class="card">
      <div class="card-label">Battery</div>
      <div class="card-value" id="batt-val">--</div>
      <div class="card-unit">volts</div>
      <div class="batt-bar-bg"><div id="batt-bar"></div></div>
    </div>
    <div class="card" style="flex:1; overflow-y:auto;">
      <div class="card-label">Waypoints</div>
      <div id="wp-list"></div>
    </div>
    <div id="last-updated">Last updated: --</div>
  </div>
</div>

<script>
var SCRIPT_ID = "AKfycbxRqAsRXzpPZ8ehA-fdHW12KA1bJ6bXTaaH92HrkOPLC3-QwA0WQePm0t2o21S5TLRsGg";
var SHEET_URL = `https://script.google.com/macros/s/${SCRIPT_ID}/exec?action=read`;

var BATT_MAX    = 13.2;
var BATT_MIN    = 10.5;
var BATT_RETURN = 10.8;
var GEO_TL = [39.950792, -75.547125];
var GEO_TR = [39.954544, -75.541422];
var GEO_BR = [39.952503, -75.539222];
var GEO_BL = [39.948725, -75.544747];

var PX_TL = [0,   0  ];
var PX_TR = [100, 0  ];
var PX_BR = [100, 100];
var PX_BL = [0,   100];
function latLngToXY(lat, lng) {
  var tl = GEO_TL, tr = GEO_TR, br = GEO_BR, bl = GEO_BL;
  var s = 0.5, t = 0.5;
  for (var i = 0; i < 20; i++) {
    var la = tl[0]*(1-s)*(1-t) + tr[0]*s*(1-t) + br[0]*s*t + bl[0]*(1-s)*t;
    var lo = tl[1]*(1-s)*(1-t) + tr[1]*s*(1-t) + br[1]*s*t + bl[1]*(1-s)*t;
    var dla_ds = -tl[0]*(1-t) + tr[0]*(1-t) + br[0]*t - bl[0]*t;
    var dla_dt = -tl[0]*(1-s) - tr[0]*s    + br[0]*s  + bl[0]*(1-s);
    var dlo_ds = -tl[1]*(1-t) + tr[1]*(1-t) + br[1]*t - bl[1]*t;
    var dlo_dt = -tl[1]*(1-s) - tr[1]*s    + br[1]*s  + bl[1]*(1-s);
    var det = dla_ds*dlo_dt - dla_dt*dlo_ds;
    if (Math.abs(det) < 1e-15) break;
    s -= ( dlo_dt*(la-lat) - dla_dt*(lo-lng)) / det;
    t -= (-dlo_ds*(la-lat) + dla_ds*(lo-lng)) / det;
    s = Math.max(0, Math.min(1, s));
    t = Math.max(0, Math.min(1, t));
  }
  var x = PX_TL[0]*(1-s)*(1-t) + PX_TR[0]*s*(1-t) + PX_BR[0]*s*t + PX_BL[0]*(1-s)*t;
  var y = PX_TL[1]*(1-s)*(1-t) + PX_TR[1]*s*(1-t) + PX_BR[1]*s*t + PX_BL[1]*(1-s)*t;
  return { x: x, y: y };
}

var WAYPOINTS = [
  { id:"WP-00", name:"Dock",        lat:39.951211,  lng:-75.542681 },
  { id:"WP-01", name:"Waypoint 01", lat:39.950458,  lng:-75.543556 },
  { id:"WP-02", name:"Waypoint 02", lat:39.950139,  lng:-75.544589 },
  { id:"WP-03", name:"Waypoint 03", lat:39.950672,  lng:-75.545383 },
  { id:"WP-04", name:"Waypoint 04", lat:39.951317,  lng:-75.544239 },
  { id:"WP-05", name:"Waypoint 05", lat:39.952097,  lng:-75.543236 },
  { id:"WP-06", name:"Waypoint 06", lat:39.952956,  lng:-75.542319 },
  { id:"WP-07", name:"Waypoint 07", lat:39.953153,  lng:-75.541361 },
  { id:"WP-08", name:"Waypoint 08", lat:39.952875,  lng:-75.541872 },
  { id:"WP-09", name:"Waypoint 09", lat:39.952289,  lng:-75.542106 },
  { id:"WP-10", name:"Waypoint 10", lat:39.951956,  lng:-75.542756 },
  { id:"WP-11", name:"Waypoint 11", lat:39.951242,  lng:-75.543469 },
  { id:"WP-12", name:"Waypoint 12", lat:39.950625,  lng:-75.544292 },
];

function renderWaypoints(activeWP) {
  var list = document.getElementById("wp-list");
  list.innerHTML = WAYPOINTS.map((wp, i) => {
    let s = i === 0 ? "home" : i < activeWP ? "done" : i === activeWP ? "active" : "pending";
    var labels = { done:"Done", active:"Active", pending:"Pending", home:"Dock" };
    return `<div class="wp-item">
      <div class="wp-dot ${s}"></div>
      <div class="wp-name">${wp.name}</div>
      <span class="wp-tag ${s}">${labels[s]}</span>
    </div>`;
  }).join("");
}

function renderMap(activeWP) {
  var svg = document.getElementById("map-svg");
  svg.innerHTML = "";

  for (let i = 0; i < WAYPOINTS.length - 1; i++) {
    var a = latLngToXY(WAYPOINTS[i].lat, WAYPOINTS[i].lng);
    var b = latLngToXY(WAYPOINTS[i+1].lat, WAYPOINTS[i+1].lng);
    var line = document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1", a.x+"%"); line.setAttribute("y1", a.y+"%");
    line.setAttribute("x2", b.x+"%"); line.setAttribute("y2", b.y+"%");
    line.setAttribute("stroke", "rgba(100,116,139,0.3)");
    line.setAttribute("stroke-width","1.5");
    line.setAttribute("stroke-dasharray","4,4");
    svg.appendChild(line);
  }

  WAYPOINTS.forEach((wp, i) => {
    var {x, y} = latLngToXY(wp.lat, wp.lng);
    let color = i === 0 ? "#f59e0b" : i < activeWP ? "#22c55e" : i === activeWP ? "#3b82f6" : "#cbd5e1";
    var c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx", x+"%"); c.setAttribute("cy", y+"%");
    c.setAttribute("r", i === 0 ? "7" : "5");
    c.setAttribute("fill", color);
    c.setAttribute("stroke","white");
    c.setAttribute("stroke-width","2");
    svg.appendChild(c);

    var t = document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x", x+"%");
    t.setAttribute("y", (y - 3.5)+"%");
    t.setAttribute("text-anchor","middle");
    t.setAttribute("fill","#334155");
    t.setAttribute("font-size","9");
    t.setAttribute("font-family","Inter,sans-serif");
    t.setAttribute("font-weight","600");
    t.textContent = wp.id;
    svg.appendChild(t);
  });

  var boatWP = WAYPOINTS[activeWP] || WAYPOINTS[0];
  var boat = latLngToXY(boatWP.lat, boatWP.lng);

  var ping = document.createElementNS("http://www.w3.org/2000/svg","circle");
  ping.setAttribute("cx", boat.x+"%"); ping.setAttribute("cy", boat.y+"%");
  ping.setAttribute("r","6"); ping.setAttribute("fill","none");
  ping.setAttribute("stroke","#3b82f6"); ping.setAttribute("stroke-width","1.5");
  ping.innerHTML = `<animate attributeName="r" from="6" to="18" dur="1.5s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" from="0.7" to="0" dur="1.5s" repeatCount="indefinite"/>`;

  var dot = document.createElementNS("http://www.w3.org/2000/svg","circle");
  dot.setAttribute("cx", boat.x+"%"); dot.setAttribute("cy", boat.y+"%");
  dot.setAttribute("r","6"); dot.setAttribute("fill","#3b82f6");
  dot.setAttribute("stroke","white"); dot.setAttribute("stroke-width","2");

  var label = document.createElementNS("http://www.w3.org/2000/svg","text");
  label.setAttribute("x", (boat.x+3)+"%"); label.setAttribute("y", (boat.y-3)+"%");
  label.setAttribute("fill","#1e40af"); label.setAttribute("font-size","10");
  label.setAttribute("font-family","Inter,sans-serif"); label.setAttribute("font-weight","600");
  label.textContent = "AWR";

  svg.appendChild(ping); svg.appendChild(dot); svg.appendChild(label);
}

async function fetchData() {
  try {
    var res  = await fetch(SHEET_URL);
    var rows = await res.json();
    if (!rows || rows.length === 0) return;

    var latest = rows[rows.length - 1];
    var temp   = parseFloat(latest[1]);
    var batt   = parseFloat(latest[4]);
    var wp     = parseInt(latest[5]) || 0;

    document.getElementById("temp-val").textContent = isNaN(temp) ? "--" : temp.toFixed(1);
    document.getElementById("batt-val").textContent = isNaN(batt) ? "--" : batt.toFixed(1);

    var pct = Math.max(0, Math.min(100, ((batt - BATT_MIN) / (BATT_MAX - BATT_MIN)) * 100));
    var bar = document.getElementById("batt-bar");
    bar.style.width = pct + "%";
    bar.style.background = batt < BATT_RETURN ? "#ef4444" : batt < 11.5 ? "#f59e0b" : "#22c55e";

    document.getElementById("warn-banner").style.display = batt < BATT_RETURN ? "block" : "none";
    document.getElementById("last-updated").textContent = "Last updated: " + new Date().toLocaleTimeString();

    renderWaypoints(wp);
    renderMap(wp);

  } catch(e) {
    document.getElementById("status-txt").textContent = "Offline";
    document.getElementById("status-txt").style.color = "#ef4444";
    document.querySelector(".status-dot").style.background = "#ef4444";
  }
}

renderWaypoints(3);
renderMap(3);
fetchData();
setInterval(fetchData, 10000);
</script>
</body>
</html>
